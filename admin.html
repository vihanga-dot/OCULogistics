<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - OUSL Logistics Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo" style="text-decoration: none;">
                    <img src="assets/images/logo.png" alt="OUSL Logistics Club Logo" class="logo-img">
                    <span>OUSL Logistics Club</span>
                </a>
                <div class="admin-user">
                    Signed in as <span id="admin-name">Admin</span>
                    <div>
                        Access level: <span id="admin-access-level" class="admin-access-level">Loading...</span>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-link"><i class="fas fa-arrow-left"></i> Back to Main Site</a>
                <a href="#" class="sidebar-link active" data-section="posts"><i class="fas fa-thumbtack"></i> Posts</a>
                <a href="#" class="sidebar-link" data-section="articles"><i class="fas fa-newspaper"></i> Articles</a>
                <a href="#" class="sidebar-link" data-section="papers"><i class="fas fa-book"></i> Papers</a>
                <a href="#" class="sidebar-link" data-section="notes"><i class="fas fa-sticky-note"></i> Notes</a>
                <a href="#" class="sidebar-link" data-section="events"><i class="fas fa-calendar"></i> Events</a>
                <a href="#" class="sidebar-link management-only" data-section="users"><i class="fas fa-users-cog"></i> Users</a>
                <a href="#" class="sidebar-link" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="admin-main">
            <section class="admin-section active" id="posts-section">
                <div class="section-header">
                    <h2><i class="fas fa-thumbtack"></i> Posts</h2>
                    <button class="btn btn-primary" id="add-post-btn">Add Post</button>
                </div>
                <div class="content-list" id="admin-posts-list"></div>
            </section>

            <section class="admin-section" id="articles-section">
                <div class="section-header">
                    <h2><i class="fas fa-newspaper"></i> Articles</h2>
                    <button class="btn btn-primary" id="add-article-btn">Add Article</button>
                </div>
                <div class="content-list" id="admin-articles-list"></div>
            </section>

            <section class="admin-section" id="papers-section">
                <div class="section-header">
                    <h2><i class="fas fa-book"></i> Papers</h2>
                    <button class="btn btn-primary" id="add-paper-btn">Add Paper</button>
                </div>
                <div class="content-list" id="admin-papers-list"></div>
            </section>

            <section class="admin-section" id="notes-section">
                <div class="section-header">
                    <h2><i class="fas fa-sticky-note"></i> Notes</h2>
                    <button class="btn btn-primary" id="add-note-btn">Add Note</button>
                </div>
                <div class="content-list" id="admin-notes-list"></div>
            </section>

            <section class="admin-section" id="events-section">
                <div class="section-header">
                    <h2><i class="fas fa-calendar"></i> Events</h2>
                    <button class="btn btn-primary" id="add-event-btn">Add Event</button>
                </div>
                <div class="content-list" id="admin-events-list"></div>
            </section>

            <section class="admin-section management-only" id="users-section">
                <div class="section-header">
                    <h2><i class="fas fa-users-cog"></i> Users</h2>
                    <button class="btn btn-primary management-only" id="add-user-btn">Add User</button>
                </div>
                <div class="content-list" id="admin-users-list"></div>
            </section>
        </main>
    </div>

    <div class="modal" id="content-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Item</h2>
                <button class="close-modal" type="button">&times;</button>
            </div>
            <form id="content-form">
                <div id="form-fields"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
    <script src="js/effects.js"></script>
</body>
</html>
